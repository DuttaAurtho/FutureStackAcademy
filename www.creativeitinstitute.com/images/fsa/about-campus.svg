<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 428" width="746" height="428">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16161d"/><stop offset=".6" stop-color="#0f1e3d"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
<radialGradient id="glow" cx=".72" cy=".35" r=".55"><stop offset="0" stop-color="#2563eb" stop-opacity=".45"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" opacity=".1"/></pattern>
<linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0b1222"/></linearGradient>
</defs>
<rect width="746" height="428" fill="url(#bg)"/>
<rect width="746" height="428" fill="url(#dots)"/>
<rect width="746" height="428" fill="url(#glow)"/>

<!-- left copy -->
<text x="40" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#fff" opacity=".7">FUTURESTACKACADEMY</text>
<text x="40" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#fff">Learn on campus.</text>
<text x="40" y="186" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#fff">Build real projects.</text>
<text x="40" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#60a5fa">Grow with mentors.</text>
