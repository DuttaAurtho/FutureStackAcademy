<rect x="40" y="272" width="118" height="34" rx="17" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/>
<text x="99" y="294" text-anchor="middle">In-person</text>
<rect x="168" y="272" width="128" height="34" rx="17" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/>
